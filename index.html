<title>KNT 拠点タイマー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="s">
/* layout: one narrow column; clock, our stations (defend), targets (attack), alliance buffs */
:root{
  --bg:#eef4fa; --panel:#ffffff; --ink:#0f2440; --muted:#5b6f88; --line:#d3e0ee;
  --accent:#1d4f8f; --ice:#8cc4f2; --chip:#e3eef9; --gain:#1d7a3e;
  --hot:#c62f3a; --hot-bg:#fde7e9; --warn:#a86400; --warn-bg:#fff2d9; --ok:#1d6b4a; --ok-bg:#e1f3ea; --gone:#6b7280; --gone-bg:#eceff3;
  --atk:#7a3fb8; --atk-bg:#f0e6fb;
  --f-disp:"M PLUS 1p","Hiragino Sans",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1626; --panel:#11223a; --ink:#e6f0fb; --muted:#93a8c2; --line:#22395a; --accent:#8cc4f2; --ice:#3b78b8; --chip:#18304f; --gain:#6fd38f;
  --hot:#ff8089; --hot-bg:#3a1a22; --warn:#f2b55b; --warn-bg:#352813; --ok:#6fd3a3; --ok-bg:#12302a; --gone:#9aa3b0; --gone-bg:#1b2738; --atk:#c9a2f2; --atk-bg:#2b1d42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1626; --panel:#11223a; --ink:#e6f0fb; --muted:#93a8c2; --line:#22395a; --accent:#8cc4f2; --ice:#3b78b8; --chip:#18304f; --gain:#6fd38f;
  --hot:#ff8089; --hot-bg:#3a1a22; --warn:#f2b55b; --warn-bg:#352813; --ok:#6fd3a3; --ok-bg:#12302a; --gone:#9aa3b0; --gone-bg:#1b2738; --atk:#c9a2f2; --atk-bg:#2b1d42; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp)}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em;text-wrap:balance}
h2{margin:8px 0 0;font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:12px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.clock{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clock div{background:var(--panel);padding:10px 12px}
.clock b{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.clock span{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center}
.pic{width:84px;aspect-ratio:389/318;max-width:100%;border-radius:8px;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.name i{font-style:normal;color:var(--muted);font-weight:600;font-size:12px;margin-right:4px}
.eff{align-self:flex-start;font-size:12px;font-weight:700;background:var(--chip);color:var(--gain);padding:2px 8px;border-radius:6px}
.cd{font-family:var(--f-num);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.times{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center}
.times em{font-style:normal;color:var(--ink);font-family:var(--f-num)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:auto}
.s-hot .pill{background:var(--hot-bg);color:var(--hot)} .s-hot .cd{color:var(--hot)} .s-hot{border-color:var(--hot)}
.s-warn .pill{background:var(--warn-bg);color:var(--warn)} .s-warn .cd{color:var(--warn)}
.s-ok .pill{background:var(--ok-bg);color:var(--ok)}
.s-gone{opacity:.75} .s-gone .pill{background:var(--gone-bg);color:var(--gone)} .s-gone .cd{color:var(--gone)}
.s-contest{border-color:var(--hot);border-width:2px;background:var(--hot-bg)} .s-contest .pill{background:var(--hot);color:var(--panel)} .s-contest .cd{color:var(--hot)}
.s-atk{border-color:var(--atk);border-width:2px} .s-atk .pill{background:var(--atk-bg);color:var(--atk)} .s-atk .cd{color:var(--atk)}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);line-height:1.5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.legend b{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.own{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.rule{font-size:11px;color:var(--muted)}
.buffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.buffs div{background:var(--panel);padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.buffs b{color:var(--gain);font-variant-numeric:tabular-nums}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;font-weight:700}
button.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ed h3{margin:0;font-size:15px}
.erow{display:grid;grid-template-columns:58px 1fr 1fr;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.erow .w2{grid-column:span 2}
.erow input.w2:last-child{grid-column:1 / -1}
input,select{font:inherit;font-size:14px;width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input.rem{font-family:var(--f-num)}
.del{color:var(--hot)}
.msg{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
</style>

<script id="app">
(function(){
var S=JSON.parse(document.getElementById('state').textContent);
var IM={};try{IM=JSON.parse(document.getElementById('imgs').textContent)}catch(e){}
var root=document.getElementById('root');
var editing=false,canEdit=false,artifactNs=null,draft=null,msg='';
function pad(n){return String(n).padStart(2,'0')}
function fmt(d,off){var t=new Date(d.getTime()+off*3600000);return (t.getUTCMonth()+1)+'/'+t.getUTCDate()+' '+pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())}
function clock(off){var t=new Date(Date.now()+off*3600000);return pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())+':'+pad(t.getUTCSeconds())}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400);s%=86400;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (d?d+'d ':'')+pad(h)+':'+pad(m)+':'+pad(x)}
function parseRem(str){str=(str||'').trim().toLowerCase().replace(/日/g,'d').replace(/：/g,':');if(!str)return null;var d=0,m=str.match(/^(\d+)\s*d\s*(.*)$/);if(m){d=+m[1];str=m[2].trim()}var p=str?str.split(':').map(Number):[];if(p.some(isNaN)||p.length>3)return null;while(p.length<3)p.unshift(0);return ((d*24+p[0])*3600+p[1]*60+p[2])*1000}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var WIN=24*3600000;
var PROT=72*3600000,CYC=PROT+WIN;
var RULE={1:['15分','重傷10%'],2:['20分','重傷20%'],3:['25分','重傷30%'],4:['30分','重傷30%・死亡10%']};
function phase(end,now,g){var e=new Date(end).getTime(),pred=false,pe=e;
  if(now>=e){var k=Math.floor((now-e)/CYC),cs=e+k*CYC;pred=k>0;
    if(now<cs+WIN)return{key:'c',ms:cs+WIN-now,until:cs+WIN,pred:pred,cls:g==='target'?'s-atk':'s-contest',pill:g==='target'?'攻撃可能':'争奪可能・防衛中',lab:'争奪終了'};
    pe=cs+CYC;pred=true}
  var ms=pe-now;return{key:'p',ms:ms,until:pe,pred:pred,cls:ms<3600000?'s-hot':ms<6*3600000?'s-warn':'s-ok',pill:ms<3600000?'1時間以内に争奪開始':ms<6*3600000?'6時間以内に争奪開始':'保護中',lab:'争奪開始'}}
function rank(k){return k==='c'?0:1}
function sorted(g){var now=Date.now();return S.stations.filter(function(s){return (s.g||'own')===g}).map(function(s){return{s:s,ph:phase(s.end,now,g)}}).sort(function(a,b){return rank(a.ph.key)-rank(b.ph.key)||a.ph.until-b.ph.until}).map(function(o){return o.s})}
function card(s,now){var g=s.g||'own',ph=phase(s.end,now,g),u=new Date(ph.until),src=s.img&&IM[s.img];
  return '<div class="row '+ph.cls+'" data-end="'+esc(s.end)+'" data-g="'+g+'" data-k="'+ph.key+'"><div class="pic">'+(src?'<img src="'+src+'" alt="Lv'+s.lv+' '+esc(s.type)+'工程ステーション">':'Lv'+s.lv)+'</div><div class="info"><div class="top"><span class="name"><i>Lv'+s.lv+'</i>'+esc(s.type)+'工程ステーション</span><span class="cd">'+dur(ph.ms)+'</span></div><div class="meta"><span class="eff">'+esc(s.effect)+'</span>'+(s.owner?'<span class="own">占領者 '+esc(s.owner)+'</span>':'')+'</div>'+(RULE[s.lv]?'<div class="rule">完全制御まで '+RULE[s.lv][0]+'｜争奪時 '+RULE[s.lv][1]+'</div>':'')+'<div class="times"><span>'+ph.lab+'</span><span>UTC <em>'+fmt(u,0)+'</em></span><span>日本 <em>'+fmt(u,9)+'</em></span><span class="pill">'+ph.pill+(ph.pred?'（予測）':'')+'</span></div></div></div>'}
function render(){
  var now=Date.now(),h='';
  h+='<div class="wrap"><div><h1>KNT 拠点タイマー</h1><div class="sub">拠点争奪・工程ステーション｜最終更新 '+fmt(new Date(S.updated),9)+'（日本時間）</div></div>';
  h+='<div class="clock"><div><b>いまの時刻 UTC</b><span id="cu">'+clock(0)+'</span></div><div><b>日本時間 JST</b><span id="cj">'+clock(9)+'</span></div></div>';
  h+='<div class="legend"><span><b>保護中</b>：3日間、攻撃されない時間。残り時間は「争奪開始」まで</span><span><b>争奪可能</b>：24時間、隣接する同盟が攻撃できる時間。攻略されなければ占領者がそのまま保有し、次の保護に入ります</span><span><b>（予測）</b>：守り切った前提で自動計算した時間です</span></div>';
  var own=sorted('own'),tg=sorted('target');
  h+='<h2>占領済<small>守る拠点 '+own.length+'</small></h2><div class="list">'+(own.length?own.map(function(s){return card(s,now)}).join(''):'<div class="empty">占領済の拠点はありません</div>')+'</div>';
  h+='<h2>占領可能<small>狙える拠点 '+tg.length+'</small></h2><div class="list">'+(tg.length?tg.map(function(s){return card(s,now)}).join(''):'<div class="empty">いま狙える拠点はありません</div>')+'</div>';
  if(S.buffs&&S.buffs.length)h+='<h2>同盟の現在の強化<small>占領効果の合計</small></h2><div class="buffs">'+S.buffs.map(function(b){return'<div><span>'+esc(b[0])+'</span><b>'+esc(b[1])+'</b></div>'}).join('')+'</div>';
  h+='<p class="foot">残り時間は最終更新時のスクショから計算しています。争奪を守り切ったあとは「保護3日→争奪24時間」の繰り返しを自動計算します。拠点を取られた・新しく取ったときは更新が必要です。強化効果は工程ステーションと隣接している領土にだけ発生し、同じタイプ・同じレベルの効果は重ね掛けできません。</p>';
  if(canEdit&&!editing)h+='<div class="bar"><button class="pri" id="bEdit">編集する</button><span class="msg">'+esc(msg)+'</span></div>';
  if(editing)h+=editor();
  h+='</div>';
  root.innerHTML=h;bind();
}
function editor(){
  var h='<div class="ed"><h3>拠点を編集（佳奈美さんのみ）</h3><p class="hint">「残り時間」はゲーム画面の表示をそのまま入力し、保護状態か争奪可能状態かを選びます。空欄なら今の時刻のまま。</p>';
  draft.forEach(function(s,i){h+='<div class="erow"><select id="lv'+i+'" data-i="'+i+'" data-k="lv">'+[1,2,3,4,5,6].map(function(n){return'<option value="'+n+'"'+(n==s.lv?' selected':'')+'>Lv'+n+'</option>'}).join('')+'</select><input id="ty'+i+'" data-i="'+i+'" data-k="type" placeholder="種類（技術など）" value="'+esc(s.type)+'"><select id="gr'+i+'" data-i="'+i+'" data-k="g"><option value="own"'+(s.g!=='target'?' selected':'')+'>占領済</option><option value="target"'+(s.g==='target'?' selected':'')+'>占領可能</option></select><button class="del" data-del="'+i+'" aria-label="削除">削除</button><input id="ef'+i+'" data-i="'+i+'" data-k="effect" placeholder="効果（研究速度 +5.0%）" value="'+esc(s.effect)+'"><input class="rem" id="rm'+i+'" data-i="'+i+'" data-k="rem" placeholder="残り時間" value="'+esc(s.rem)+'"><select id="ph'+i+'" data-i="'+i+'" data-k="ph" class="w2"><option value="p"'+(s.ph!=='c'?' selected':'')+'>保護状態の残り時間</option><option value="c"'+(s.ph==='c'?' selected':'')+'>争奪可能状態の残り時間</option></select><input id="ow'+i+'" data-i="'+i+'" data-k="owner" class="w2" placeholder="占領者（敵の拠点のみ）" value="'+esc(s.owner)+'"></div>'});
  h+='<div class="bar"><button id="bAdd">＋ 拠点を追加</button></div>';
  h+='<div class="bar"><button class="pri" id="bSave">保存してメンバーに公開</button><button id="bCancel">やめる</button><span class="msg">'+esc(msg)+'</span></div></div>';
  return h;
}
function bind(){
  var q=function(id){return document.getElementById(id)};
  if(q('bEdit'))q('bEdit').onclick=function(){draft=S.stations.map(function(s){return{id:s.id,g:s.g||'own',lv:s.lv,type:s.type,effect:s.effect,owner:s.owner||'',end:s.end,img:s.img,rem:'',ph:phase(s.end,Date.now(),s.g||'own').key==='c'?'c':'p'}});editing=true;msg='';render()};
  if(!editing)return;
  root.querySelectorAll('[data-k]').forEach(function(el){var f=function(){draft[+el.dataset.i][el.dataset.k]=el.dataset.k==='lv'?+el.value:el.value};el.oninput=f;el.onchange=f});
  root.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){draft.splice(+b.dataset.del,1);render()}});
  q('bAdd').onclick=function(){draft.push({id:'n'+Date.now(),g:'own',lv:1,type:'',effect:'',end:null,img:null,rem:'',ph:'p'});render();var el=q('ty'+(draft.length-1));if(el)el.focus()};
  q('bCancel').onclick=function(){editing=false;msg='';render()};
  q('bSave').onclick=save;
}
function iso(t){return new Date(t).toISOString().replace(/\.\d+Z$/,'Z')}
function save(){
  var now=Date.now(),out=[];
  for(var i=0;i<draft.length;i++){var s=draft[i],end=s.end;
    if(s.rem){var ms=parseRem(s.rem);if(ms==null){msg=(i+1)+'件目の残り時間が読めません。「1d 08:41:29」の形で入力してください';render();return}end=iso(now+ms-(s.ph==='c'?WIN:0))}
    if(!end){msg=(i+1)+'件目に残り時間を入力してください';render();return}
    out.push({id:s.id,g:s.g,lv:s.lv,type:(s.type||'').trim()||'不明',effect:(s.effect||'').trim(),owner:(s.owner||'').trim(),end:end,img:s.img||null})}
  var next={updated:iso(now),buffs:S.buffs||[],stations:out};
  msg='保存中…';render();
  artifactNs.publish(buildDoc(next)).then(function(){},function(err){var c=err&&err.code;msg=c==='conflict'?'他の画面で先に保存されました。もう一度編集してください':(c==='not_granted'||c==='not_writer')?'この画面からは保存できません':'保存できませんでした。もう一度お試しください';render()});
}
function buildDoc(state){
  var css=document.getElementById('s').textContent,js=document.getElementById('app').textContent,im=document.getElementById('imgs').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c'),SC='script';
  var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  return head+'<title>KNT 拠点タイマー</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="s">'+css+'</style>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=M+PLUS+1p:wght@500;700;800&display=swap">\n<div id="root"></div>\n<'+SC+' type="application/json" id="state">'+json+'</'+SC+'>\n<'+SC+' type="application/json" id="imgs">'+im+'</'+SC+'>\n<'+SC+' id="app">'+js+'</'+SC+'>\n</body></html>';
}
function tick(){
  var cu=document.getElementById('cu'),cj=document.getElementById('cj');if(cu)cu.textContent=clock(0);if(cj)cj.textContent=clock(9);
  if(editing)return;
  var now=Date.now(),flip=false;
  root.querySelectorAll('.row').forEach(function(r){var ph=phase(r.dataset.end,now,r.dataset.g);if(ph.key!==r.dataset.k||!r.classList.contains(ph.cls))flip=true;r.querySelector('.cd').textContent=dur(ph.ms)});
  if(flip)render();
}
render();setInterval(tick,1000);
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    artifactNs=r[0];var u=r[1];if(!artifactNs||!u)return;
    return Promise.all([u.isOwner(),u.canEdit()]).then(function(b){canEdit=!!(b[0]||b[1]);if(canEdit&&!editing)render()});
  },function(){});
}
})();
</script>
