<!doctype html>
<html lang="ja" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4148王国 兵器工場アンケート 集計</title>
<meta property="og:title" content="4148王国 兵器工場アンケート 集計">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=M+PLUS+1p:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../survey/style.css">
<style>
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-num);font-size:24px;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed=true]{color:#0a1626}}
:root[data-theme="dark"] .seg button[aria-pressed=true]{color:#0a1626}
/* hero summary */
.hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.hc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.hc .t{display:flex;align-items:center;gap:6px;font-weight:800}
.face{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line)}
.face.sm{width:28px;height:28px;border-radius:6px;margin-bottom:2px}
.hc .t .own{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.mini{display:grid;grid-template-columns:3.2em 1fr;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--chip)}
.stack i{display:block;height:100%;font-style:normal;font-family:var(--f-num);font-size:10px;font-weight:700;line-height:16px;text-align:center;color:#fff;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* table */
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:var(--panel);max-height:75vh}
table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--chip);font-weight:700;font-size:11px;color:var(--muted);z-index:2;cursor:pointer;user-select:none}
thead th.on{color:var(--accent)}
thead th:first-child{left:0;z-index:3}
tbody th{text-align:left;font-weight:800;background:var(--panel);position:sticky;left:0;z-index:1;max-width:9em;overflow:hidden;text-overflow:ellipsis}
td.n{font-family:var(--f-num);font-weight:700}
td.h{min-width:3.6em;padding:3px}
.cell{border-radius:6px;padding:2px 3px;line-height:1.25}
.cell b{display:block;font-family:var(--f-num);font-size:13px}
.cell small{display:block;font-family:var(--f-num);font-size:10px;opacity:.85}
.c0{background:transparent;color:var(--muted)}
.pdfsheet th,.pdfsheet td{position:static !important;max-width:none !important;overflow:visible !important;cursor:default !important;border-radius:0 !important}
.pdfsheet thead th{background:#1d4f8f !important;color:#fff !important;font-size:11px !important}
.pdfsheet tbody td:first-child{text-align:left}
.exp{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.exp .btn{flex:1 1 180px;justify-content:center;padding:12px}
.c1{background:var(--l1)} .c2{background:var(--l2)} .c3{background:var(--l3);color:#fff} .c4{background:var(--l4);color:#fff} .c5{background:var(--l5);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c3,:root:not([data-theme="light"]) .c4,:root:not([data-theme="light"]) .c5{color:#0a1626}}
:root[data-theme="dark"] .c3,:root[data-theme="dark"] .c4,:root[data-theme="dark"] .c5{color:#0a1626}
.jt{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--muted)}
.jt.on{background:var(--ok-bg);color:var(--ok)}
.jt.or{background:#ffeedd;color:#c25a00}
.jt.no{background:#fde4ef;color:#c2185b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jt.or{background:#3a2814;color:#ffb366}:root:not([data-theme="light"]) .jt.no{background:#3a1a2a;color:#ff8fbf}}
:root[data-theme="dark"] .jt.or{background:#3a2814;color:#ffb366}
:root[data-theme="dark"] .jt.no{background:#3a1a2a;color:#ff8fbf}
.miss{display:flex;flex-wrap:wrap;gap:6px}
.miss span{background:var(--knt-bg);color:var(--knt);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.miss em{font-style:normal;color:var(--ok);font-weight:700;font-size:13px}
.memo{font-size:12px;display:flex;flex-direction:column;gap:6px}
.memo div{background:var(--bg);border-radius:8px;padding:6px 9px}
.memo b{margin-right:6px}
select,input[type=password],input[type=text]{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.muted{color:var(--muted);font-size:12px}
.demo{background:var(--chip);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="wrap wide">
  <header>
    <h1 id="title">英雄育成状況 集計</h1>
    <div class="sub" id="meta">読み込み中…</div>
  </header>

  <div class="demo" id="demoNote" hidden>表示確認用のサンプルデータです（実際の回答ではありません）</div>
  <section class="card" id="closedBox" hidden>
    <h2>集計の公開は終了しました</h2>
    <div class="sub">アンケートの締切（<span id="closedAt"></span>）を過ぎたため、集計結果は表示されません。</div>
    <div class="sub" style="margin-top:12px">回答の一覧は、ファイルで保存できます。</div>
    <div class="exp"><button class="btn pri" id="xlsx" type="button">エクセルシートで出力</button><button class="btn pri" id="pdf" type="button">PDFで出力</button></div>
    <div class="sub" id="expMsg" hidden></div>
  </section>
  <div class="notice" id="err" hidden></div>

  <section class="card" id="passBox" hidden>
    <h2>合言葉</h2>
    <form class="tools" id="passForm"><input type="password" id="pass" placeholder="合言葉" autocomplete="current-password"><button class="btn pri">表示</button></form>
  </section>

  <div id="main" hidden>
    <div class="kpi" id="kpi"></div>

    <div class="tools" style="margin-top:16px">
      <select id="fally" hidden aria-label="同盟で絞り込み"></select>
      <div class="seg" id="ftype"></div>
      <button class="btn" id="reload" type="button">更新</button>
      <button class="btn" id="csv" type="button">CSVを保存</button>
      <a class="btn" href="./">回答ページへ</a>
    </div>

    <section style="margin-top:16px">
      <h2>英雄ごとのまとめ <small>右上遠征スキルLv ／ ★ ／ 専用装備</small></h2>
      <div class="legend" id="legend" style="margin-bottom:8px"></div>
      <div class="hs" id="hs"></div>
    </section>

    <section style="margin-top:20px">
      <h2>メンバー一覧 <small>列名をタップで並べ替え ・ 上段＝スキルLv、下段＝★-段・専用装備</small></h2>
      <div class="scroll"><table id="tbl"></table></div>
    </section>

    <section class="card" style="margin-top:20px" id="missBox" hidden>
      <h2>未回答 <small id="missN"></small></h2>
      <div class="miss" id="missList"></div>
    </section>

    <section class="card" style="margin-top:20px" id="memoBox" hidden>
      <h2>ひとこと <small>今後の同盟運営について</small></h2>
      <div class="memo" id="memos"></div>
    </section>
  </div>

  <footer>WOS2026　製作者「FURUKANA」</footer>
</div>

<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>')</script>
<script>
(function(){
  var C=window.SURVEY, H=C.HEROES, $=function(i){return document.getElementById(i)};
  var all=[], rows=[], fally='全同盟', ftype='全部', sortKey='総力', sortDir=-1, PASSK='knt-survey-pass';
  var DEMO=/[?&]demo=1/.test(location.search);
  $('title').textContent=C.TITLE+' 集計';

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function pw(s){ // 総力 "158.2M" → 数値
    var m=String(s||'').replace(/,/g,'').match(/([\d.]+)\s*([kKmMbBgG万億]?)/); if(!m) return 0;
    var n=parseFloat(m[1]), u=m[2]; return n*({k:1e3,K:1e3,m:1e6,M:1e6,b:1e9,B:1e9,g:1e9,G:1e9,'万':1e4,'億':1e8}[u]||1);
  }
  function starVal(v){ return v&&v.skill>0&&typeof v.star==='number' ? v.star+(v.star<5?(v.step||0)/6:0) : -1; }
  function starTxt(v){ return !v||v.skill===0?'':('★'+v.star+(v.star<5?'-'+(v.step||0):'')); }
  function lv5(r){ return H.filter(function(h){var v=r.heroes[h.name];return v&&v.skill===5}).length; }

  function isClosed(){ return !DEMO && !!C.CLOSE_AT && Date.now() >= new Date(C.CLOSE_AT).getTime(); }
  function closeView(){ all=[]; rows=[]; $('main').hidden=true; $('passBox').hidden=true; $('err').hidden=true; $('demoNote').hidden=true; $('meta').textContent=''; $('closedAt').textContent=C.DEADLINE||C.CLOSE_AT; $('closedBox').hidden=false; }
  function load(){
    if(isClosed()) return closeView();
    $('err').hidden=true;
    if(DEMO){ all=demo(); $('demoNote').hidden=false; return show(); }
    if(!C.API_URL){ $('meta').textContent=''; $('err').textContent='送信先（API_URL）が未設定です。config.js を設定してください。'; $('err').hidden=false; return; }
    var pass=''; try{pass=localStorage.getItem(PASSK)||''}catch(e){}
    $('meta').textContent='読み込み中…';
    fetch(C.API_URL+(pass?'?pass='+encodeURIComponent(pass):''))
      .then(function(r){return r.json()})
      .then(function(j){
        if(j.closed) return closeView();
        if(j.needPass){ $('passBox').hidden=false; $('main').hidden=true; $('meta').textContent=''; if(pass){$('err').textContent=j.error;$('err').hidden=false;} return; }
        if(!j.ok) throw new Error(j.error);
        $('passBox').hidden=true; all=j.rows||[]; show();
      })
      .catch(function(e){ $('meta').textContent=''; $('err').textContent='読み込みに失敗しました'+(e&&e.message?'：'+e.message:''); $('err').hidden=false; });
  }
  $('passForm').onsubmit=function(e){e.preventDefault(); try{localStorage.setItem(PASSK,$('pass').value)}catch(x){} load();};
  $('reload').onclick=load;

  function heroesShown(){ return H.filter(function(h){return ftype==='全部'||h.type===ftype}); }

  function show(){
    $('main').hidden=false;
    rows=all.filter(function(r){return fally==='全同盟'||r['所属同盟']===fally});
    var als=['全同盟'].concat(C.ALLIANCES.filter(function(a){return all.some(function(r){return r['所属同盟']===a})}));
    all.forEach(function(r){var a=r['所属同盟']; if(a&&als.indexOf(a)<0) als.push(a)});
    var fa=$('fally'); fa.innerHTML=''; fa.hidden=als.length<=2;
    als.forEach(function(a){var o=document.createElement('option');o.value=a;o.textContent=a==='全同盟'?'全同盟':a+'（'+all.filter(function(r){return r['所属同盟']===a}).length+'人）';fa.appendChild(o)});
    fa.value=fally; fa.onchange=function(){fally=fa.value;show()};
    var latest=rows.map(function(r){return r['回答日時']}).sort().pop()||'';
    $('meta').textContent=(fally!=='全同盟'?fally+' ／ ':'')+(C.DEADLINE?'締切：'+C.DEADLINE+' ／ ':'')+'回答 '+rows.length+'人'+(latest?' ／ 最新 '+latest:'');
    var tot=0,cnt=0,l5=0; rows.forEach(function(r){var p=pw(r['総力']);if(p){tot+=p;cnt++} l5+=lv5(r)});
    var NOJOIN=C.JOIN[C.JOIN.length-1]; var dash=rows.filter(function(r){return r['参加可能時間']&&r['参加可能時間']!==NOJOIN}).length;
    $('kpi').innerHTML=
      '<div><b>'+rows.length+(C.MEMBERS&&fally==='全同盟'?' / '+C.MEMBERS.length:'')+'</b><span>回答人数</span></div>'+
      '<div><b>'+(cnt?(tot/cnt/1e6).toFixed(1)+'M':'—')+'</b><span>平均総力</span></div>'+
      '<div><b>'+(rows.length?(l5/rows.length).toFixed(1):'—')+'</b><span>1人あたり スキルLv5の英雄数</span></div>'+
      '<div><b>'+dash+' / '+rows.length+'</b><span>参加予定（'+C.JOIN.filter(function(j){return j!==NOJOIN}).map(function(j){return j.replace('から参加','')+' '+rows.filter(function(r){return r['参加可能時間']===j}).length}).join('・')+'）</span></div>';
    var ft=$('ftype'); ft.innerHTML='';
    ['全部','盾','槍','弓'].forEach(function(t){var b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed',t===ftype);b.onclick=function(){ftype=t;show()};ft.appendChild(b)});
    summary(); table(); memos(); missing();
  }

  var SK=[{k:5,l:'Lv5',c:'var(--l5)'},{k:4,l:'Lv4',c:'var(--l4)'},{k:3,l:'Lv3',c:'var(--l3)'},{k:2,l:'Lv1-2',c:'var(--l2)'},{k:0,l:'未所持',c:'var(--line)'}];
  var ST=[{k:5,l:'★5',c:'var(--l5)'},{k:4,l:'★4',c:'var(--l4)'},{k:3,l:'★3',c:'var(--l3)'},{k:2,l:'★0-2',c:'var(--l2)'},{k:0,l:'未所持',c:'var(--line)'}];
  var GS=[{k:5,l:'専Lv10',c:'var(--l5)'},{k:4,l:'専Lv7-9',c:'var(--l4)'},{k:3,l:'専Lv4-6',c:'var(--l3)'},{k:2,l:'専Lv1-3',c:'var(--l2)'},{k:1,l:'専なし',c:'var(--l1)'},{k:0,l:'未所持',c:'var(--line)'}];
  function bucketGs(v){ if(!v||v.skill===0||typeof v.gear!=='number') return 0; var g=v.gear; return g>=10?5:g>=7?4:g>=4?3:g>=1?2:1; }
  function gearTxt(v){ return v&&typeof v.gear==='number' ? (v.gear?'専Lv'+v.gear:'専なし') : ''; }
  function bucketSk(v){ if(!v||v.skill===0) return 0; return v.skill>=3?v.skill:2; }
  function bucketSt(v){ if(!v||v.skill===0) return 0; return v.star>=3?v.star:2; }
  function stack(list, fn){
    var n=rows.length||1, c={}; rows.forEach(function(r){var k=fn(r);c[k]=(c[k]||0)+1});
    return '<div class="stack">'+list.map(function(s){var x=c[s.k]||0; if(!x) return '';
      var light=s.k<=2; return '<i style="width:'+(x/n*100)+'%;background:'+s.c+(light?';color:var(--ink)':'')+'" title="'+s.l+'：'+x+'人">'+x+'</i>'}).join('')+'</div>';
  }
  function summary(){
    $('legend').innerHTML=SK.map(function(s,i){return '<span><i style="background:'+s.c+'"></i>'+s.l+' / '+ST[i].l+(H.some(function(h){return h.gear})?' / '+GS[i].l:'')+'</span>'}).join('');
    $('hs').innerHTML=heroesShown().map(function(h){
      var own=rows.filter(function(r){var v=r.heroes[h.name];return v&&v.skill>0}).length;
      return '<div class="hc"><div class="t">'+(h.icon?'<img class="face" src="'+h.icon+'" width="36" height="36" alt="">':'')+'<span class="ty '+h.type+'">'+h.type+'</span>'+esc(h.name)+' <span class="rar">'+h.rarity+'</span><span class="own">所持 '+own+'/'+rows.length+'</span></div>'+
        '<div class="mini"><span>スキル</span>'+stack(SK,function(r){return bucketSk(r.heroes[h.name])})+'</div>'+
        '<div class="mini"><span>★</span>'+stack(ST,function(r){return bucketSt(r.heroes[h.name])})+'</div>'+(h.gear?'<div class="mini"><span>専用</span>'+stack(GS,function(r){return bucketGs(r.heroes[h.name])})+'</div>':'')+'</div>';
    }).join('');
  }
  function table(){
    var hs=heroesShown();
    var cols=[{k:'所属同盟',l:'同盟'},{k:'参加',l:'兵器工場'},{k:'総力',l:'総力'},{k:'大溶鉱炉',l:'溶鉱炉'},{k:'lv5',l:'Lv5数'}].concat(hs.map(function(h){return {k:'h:'+h.name,l:h.name,h:h}}));
    var val=function(r,k){
      if(k==='総力') return pw(r['総力']); if(k==='lv5') return lv5(r); if(k==='所属同盟') return r['所属同盟']||''; if(k==='参加') return C.JOIN.length-C.JOIN.indexOf(r['参加可能時間']); if(k==='name') return r['プレイヤー名'];
      if(k==='大溶鉱炉') return C.FURNACE.length-C.FURNACE.indexOf(r['大溶鉱炉']);
      var v=r.heroes[k.slice(2)]; return v&&v.skill>0 ? v.skill*10+starVal(v) : -1;
    };
    var list=rows.slice().sort(function(a,b){var x=val(a,sortKey),y=val(b,sortKey);return (x>y?1:x<y?-1:0)*sortDir});
    var th='<thead><tr><th data-k="name"'+(sortKey==='name'?' class="on"':'')+'>名前</th>'+cols.map(function(c){
      return '<th data-k="'+esc(c.k)+'"'+(sortKey===c.k?' class="on"':'')+'>'+(c.h&&c.h.icon?'<img class="face sm" src="'+c.h.icon+'" width="28" height="28" alt=""><br>':'')+(c.h?'<span class="ty '+c.h.type+'">'+c.h.type+'</span><br>':'')+esc(c.l)+(sortKey===c.k?(sortDir<0?' ▼':' ▲'):'')+'</th>'}).join('')+'</tr></thead>';
    var tb='<tbody>'+list.map(function(r){
      return '<tr><th title="'+esc(r['回答日時'])+'">'+esc(r['プレイヤー名'])+'</th><td title="'+esc(r['所属同盟'])+'">'+esc(tag(r['所属同盟']))+'</td><td>'+joinTag(r['参加可能時間'])+'</td><td class="n">'+esc(r['総力'])+'</td><td>'+esc(r['大溶鉱炉'])+'</td><td class="n">'+lv5(r)+'</td>'+
        hs.map(function(h){var v=r.heroes[h.name];
          if(!v) return '<td class="h"><div class="cell c0">—</div></td>';
          if(v.skill===0) return '<td class="h"><div class="cell c0"><small>未所持</small></div></td>';
          return '<td class="h"><div class="cell c'+v.skill+'"><b>'+v.skill+'</b><small>'+starTxt(v)+'</small>'+(gearTxt(v)?'<small>'+gearTxt(v)+'</small>':'')+'</div></td>'}).join('')+'</tr>';
    }).join('')+'</tbody>';
    $('tbl').innerHTML=th+tb;
    [].forEach.call($('tbl').querySelectorAll('thead th'),function(t){t.onclick=function(){var k=t.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=k==='name'?1:-1} table()}});
  }
  function tag(a){ var m=String(a||'').match(/^\[([^\]]+)\]/); return m?m[1]:(a||'—'); }
  function joinTag(j){ if(!j) return '—'; var cls = j===C.JOIN[C.JOIN.length-1] ? ' no' : /^23/.test(j) ? ' or' : /^21/.test(j) ? ' on' : ''; var t=j.replace('から参加',''); return '<span class="jt'+cls+'" title="'+esc(j)+'">'+esc(t.length>7?t.slice(0,7)+'…':t)+'</span>'; }
  function nk(x){ return String(x||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase(); }
  function missing(){
    var box=$('missBox'); if(!C.MEMBERS||!C.MEMBERS.length){ box.hidden=true; return; }
    var got={}; all.forEach(function(r){ got[nk(r['プレイヤー名'])]=1; });
    var m=C.MEMBERS.filter(function(n){ return !got[nk(n)]; });
    box.hidden=false; $('missN').textContent=m.length+'人';
    $('missList').innerHTML = m.length ? m.map(function(n){return '<span>'+esc(n)+'</span>'}).join('') : '<em>全員回答済みです</em>';
  }
  function memos(){
    var m=rows.filter(function(r){return r['ひとこと']});
    $('memoBox').hidden=!m.length;
    $('memos').innerHTML=m.map(function(r){return '<div><b>'+esc(r['プレイヤー名'])+'</b>'+esc(r['ひとこと'])+'</div>'}).join('');
  }

  function matrix(list){
    var head=['プレイヤー名','所属同盟','参加可能時間','回答日時','大溶鉱炉','総力','兵士(盾)','兵士(槍)','兵士(弓)'];
    H.forEach(function(h){head.push(h.name+' スキル',h.name+' ★'); if(h.gear) head.push(h.name+' 専用装備')}); head.push('ひとこと');
    return [head].concat(list.map(function(r){
      var a=[r['プレイヤー名'],r['所属同盟'],r['参加可能時間'],r['回答日時'],r['大溶鉱炉'],r['総力'],r['兵士(盾)'],r['兵士(槍)'],r['兵士(弓)']];
      H.forEach(function(h){var v=r.heroes[h.name]; a.push(!v?'':v.skill===0?'未所持':v.skill, starTxt(v)); if(h.gear) a.push(v&&typeof v.gear==='number'?v.gear:'')}); a.push(r['ひとこと']);
      return a}));
  }
  $('csv').onclick=function(){
    var q=function(s){s=s==null?'':String(s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    var lines=matrix(rows).map(function(a){return a.map(q).join(',')});
    var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='英雄育成アンケート.csv'; document.body.appendChild(a); a.click(); a.remove();
  };

  /* ---------- 締切後のファイル出力（エクセル・PDF） ---------- */
  var FILE=String(C.TITLE||'アンケート').replace(/[\\/:*?"<>|]/g,'')+' 回答';
  function lib(src,test){ return test()?Promise.resolve():new Promise(function(ok,ng){var t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=function(){ng(new Error('部品の読み込みに失敗しました'))};document.head.appendChild(t)}); }
  function getAll(){
    if(DEMO) return Promise.resolve(demo());
    return fetch(C.API_URL+'?export=1&t='+Date.now()).then(function(r){return r.json()}).then(function(j){
      if(!j.ok||!j.rows) throw new Error(j.error||'回答を取得できませんでした');
      return j.rows.slice().sort(function(a,b){return pw(b['総力'])-pw(a['総力'])});
    });
  }
  function expRun(btn,label,fn){
    var m=$('expMsg'); btn.disabled=true; btn.textContent='作成中…'; m.hidden=true;
    getAll().then(fn).then(function(n){ m.textContent=n+'人分を保存しました。'; m.hidden=false; })
      .catch(function(e){ m.textContent='出力できませんでした：'+(e&&e.message||e); m.hidden=false; })
      .then(function(){ btn.disabled=false; btn.textContent=label; });
  }
  $('xlsx').onclick=function(){ var b=this; expRun(b,'エクセルシートで出力',function(list){
    return lib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',function(){return !!window.XLSX}).then(function(){
      var aoa=matrix(list).map(function(r,i){ return i? r.map(function(v){ return /^\d+$/.test(String(v))?Number(v):(v==null?'':v); }) : r; });
      var ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=aoa[0].map(function(h,i){ return {wch: i===0?18 : i===2?22 : i===3?17 : /ひとこと/.test(h)?40 : Math.max(8, String(h).length*2) }; });
      ws['!freeze']={xSplit:1,ySplit:1}; ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:aoa[0].length-1}})};
      var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'回答');
      XLSX.writeFile(wb,FILE+'.xlsx'); return list.length;
    }); }); };
  $('pdf').onclick=function(){ var b=this; expRun(b,'PDFで出力',function(list){
    return lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',function(){return !!window.html2canvas})
      .then(function(){ return lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',function(){return !!(window.jspdf&&window.jspdf.jsPDF)}); })
      .then(function(){ return pdfMake(list); }); }); };
  function pdfSheet(list,hs,part){
    var BG={1:'#d6e6f7',2:'#b3d2f0',3:'#7fb2e6',4:'#3f86d1',5:'#1d4f8f'};
    var td='border:1px solid #c9d3e0;padding:3px 4px;';
    var w=document.createElement('div');
    w.className='pdfsheet'; w.style.cssText='position:fixed;left:-99999px;top:0;width:1600px;background:#fff;color:#14233a;font-family:"M PLUS 1p",sans-serif;padding:24px;box-sizing:border-box';
    w.innerHTML='<div style="font-size:22px;font-weight:800;margin-bottom:4px">'+esc(C.TITLE)+' 回答一覧'+(part?'（'+part+'）':'')+'</div>'+
      '<div style="font-size:13px;color:#5b6b80;margin-bottom:12px">'+esc(C.DEADLINE?'締切：'+C.DEADLINE+' ／ ':'')+'回答 '+list.length+'人（総力の高い順）</div>'+
      '<table style="border-collapse:collapse;width:100%;font-size:12px;line-height:1.3"><thead><tr style="background:#1d4f8f;color:#fff">'+
      ['名前','参加','総力','溶鉱炉','兵士 盾/槍/弓'].map(function(h){return '<th style="'+td+'text-align:left">'+h+'</th>'}).join('')+
      hs.map(function(h){return '<th style="'+td+'text-align:center;font-size:11px">'+esc(h.name)+'</th>'}).join('')+'</tr></thead><tbody>'+
      list.map(function(r,i){ return '<tr style="background:'+(i%2?'#f5f8fc':'#fff')+'"><td style="'+td+'font-weight:700;white-space:nowrap">'+esc(r['プレイヤー名'])+'</td>'+
        '<td style="'+td+'">'+esc(String(r['参加可能時間']||'').replace('から参加',''))+'</td><td style="'+td+'text-align:right;white-space:nowrap">'+esc(r['総力'])+'</td>'+
        '<td style="'+td+'">'+esc(r['大溶鉱炉'])+'</td><td style="'+td+'white-space:nowrap">'+esc([r['兵士(盾)'],r['兵士(槍)'],r['兵士(弓)']].join('/'))+'</td>'+
        hs.map(function(h){ var v=r.heroes[h.name];
          if(!v) return '<td style="'+td+'text-align:center;color:#9aa7b8">—</td>';
          if(v.skill===0) return '<td style="'+td+'text-align:center;color:#9aa7b8;font-size:10px">未所持</td>';
          return '<td style="'+td+'text-align:center;background:'+BG[v.skill]+';color:'+(v.skill>=3?'#fff':'#14233a')+'"><b>Lv'+v.skill+'</b><br><span style="font-size:10px">'+starTxt(v)+(gearTxt(v)?' '+gearTxt(v):'')+'</span></td>'; }).join('')+'</tr>'; }).join('')+
      '</tbody></table><div style="font-size:11px;color:#5b6b80;margin-top:8px">WOS2026　製作者「FURUKANA」</div>';
    return w;
  }
  function pdfMake(list){
    var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}), PW=297, PH=210, M=8, first=true;
    var half=Math.ceil(H.length/2), parts=H.length>14?[[H.slice(0,half),'1/2'],[H.slice(half),'2/2']]:[[H,'']];
    var chain=Promise.resolve();
    parts.forEach(function(pt){ chain=chain.then(function(){
      var el=pdfSheet(list,pt[0],pt[1]); document.body.appendChild(el);
      return window.html2canvas(el,{scale:2,backgroundColor:'#fff'}).then(function(cv){
        el.remove();
        var wmm=PW-M*2, pxPerMm=cv.width/wmm, pageH=Math.floor((PH-M*2)*pxPerMm), y=0;
        while(y<cv.height){
          var h=Math.min(pageH,cv.height-y), c=document.createElement('canvas'); c.width=cv.width; c.height=h;
          c.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
          if(!first) doc.addPage(); first=false;
          doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,M,wmm,h/pxPerMm); y+=h;
        }
      });
    }); });
    return chain.then(function(){ doc.save(FILE+'.pdf'); return list.length; });
  }

  function demo(){ // 表示確認用のダミー
    var names=['サンプルA','サンプルB','サンプルC','サンプルD','サンプルE','サンプルF'], seed=7;
    var rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
    return names.map(function(n,i){var hs={}; H.forEach(function(h){
      if(rnd()<0.12){hs[h.name]={skill:0};return}
      var s=1+Math.floor(rnd()*5), st=Math.min(5,Math.floor(rnd()*6)); hs[h.name]={skill:s,star:st,step:st<5?Math.floor(rnd()*6):0}; if(h.gear) hs[h.name].gear=Math.floor(rnd()*11);});
      return {'回答日時':'2026/11/0'+(i+1)+' 21:00','プレイヤー名':n,'所属同盟':C.ALLIANCES[i%3],'参加可能時間':C.JOIN[i%C.JOIN.length],'大溶鉱炉':C.FURNACE[i%C.FURNACE.length],'総力':(80+rnd()*120).toFixed(1)+'M','兵士(盾)':C.TROOP[1],'兵士(槍)':C.TROOP[2],'兵士(弓)':C.TROOP[2],'ひとこと':i===0?'ジーナの★上げ中です':'',heroes:hs}});
  }
  load();
  setInterval(function(){ if(isClosed() && $('closedBox').hidden) closeView(); }, 30000);
})();
</script>
